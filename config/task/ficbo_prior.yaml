_target_: tasks.gaussian_process.WeightedMultiGP_Expert_GPTask 
# Additive_Expert_GPTask, WeightedMultiGP_Expert_GPTask

name: ficbo_prior

dim_x: 2
dim_y: 1

use_expert_model: True
expert_dim_x_min: 1
expert_dim_x_max: 2

# expert data parameters
expert_extra_data_min: 30 #10, 30,  need at least 1 for the code to work
expert_extra_data_max: 300 #100 ,300,
adaptive_expert: False # updates with new data
time_encoded_feedback: False # append time token to feedback, so expert can learn from the sequence of feedback, should probably be used with time encoder
expert_noise: 0. # lets add the noise in the bias model instead 
dim_feedback: 1 # 1 per default, but if we return variance as well, it should be 2, if time is added that is also +1
min_overlap_dims: 0 # overlap betwen the dimensions the expert and main model have access to
max_overlap_dims: 1

concat_bias_generated_certainty: False
expert_returns_uncertainty: False # generated by some model
expert_predict_epistemic_var: False

expert_model_type: "amortized" # amortized, truth, sklearn
expert_mode: "mean"  #for amortized:  "policy" "ucb" "ei", "pi", "mean", for truth: value, policy
normalize_outputs_to_max_one: False 
kappa: 1.0  # for ucb
expert_truth_mode: "y_hidden"  # "y", "y_hidden"  just for Additive_Expert_GPTask

# for sampling expert points, currently useless
uniform_fraction:  1. #position  sampled from uniform distr, .25 for additive prior
expert_cluster_std_min:  0.5
expert_cluster_std_max:  1.5
expert_min_centers: 1
expert_max_centers: 5

# for Additive_Expert_GPTask
lengthscale_lower_hidden: 0.1
lengthscale_upper_hidden: 2.0
expert_weight_min: 0.25 
expert_weight_max: 1.

#for WeightedMultiGP_Expert_GPTask
k_real: 3
k_decoy_min: 0 # 2-8 for combined
k_decoy_max: 5
expert_weight_alpha: .7 # this is the alpha for the beta/dirichlet distribution we sample the expert weight from, higher means more mass on higher weights, 1 is uniform
expert_weight_p: .8 # this is the p for the bernoulli we use to decide whether to use the expert or not, higher means more likely to use the expert, 1 means always use the expert

# Target mask parameters
embedding_type: mix #mix data
expert_embedding_type: mix # this is only important for loading the expert weights
mask_type: ["none"]  # ["all", "split"] for full joint training, none, partial
n_selected_targets: null  # for partial mode
predefined_masks: null
predefined_mask_weights: null
mask_index: null  # for predefined masks
attend_to: null  # for split mode, we want to only attend to data or theta

n_context_init: 1
n_query_init: 200

n_target_data: 100 #100
use_expert_thetas: False
n_target_theta: 3  # must be dim_x+ 1 + maybe some additional thing, +8 currently for expert thetas, depends on what you turn on/off

n_target_theta_expert: 3  # whatever you used when training the expert

design_scale: 5
noise_scale: 0.01

lengthscale_lower: 0.1
lengthscale_upper: 2.0
