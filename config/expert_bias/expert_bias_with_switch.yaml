_target_: expert_models.bias_models.ProbExpertBiasEngine

# Per-bias activation probabilities
bias_probs: # bit lower might be better
  #local_averaging: 0.15 # expensive, also counters some other biases like hetero noise
  add_gp_bias: 0.15
  local_distortion: 0.15
  constant_shift_bias: 0.15
  knowledge_center: 1. # good for more noise
  #binning: 1. # this should either be always or never on
  #rank_normalize: 1. # this should either be always or never on
  #rounding: 1. # this should either be always or never on
  #anchoring: 0.1 # off for bo
  #feature_weight: 0.2 # probably not that great->off
  #expectation_bias: 0.1 # off for bo
  #hard_easy: 0.25 # off for bo
  #simplification: 0.1 # off, does not seem to make problem harder
  #regression_to_mean: 0.1 # probably not that interesting for bo
  #cross_dim_confusion: 0.5 # probably not worth the comp cost->off
  #perceived_max_bias: 0.3
  #hetero_noise: .3    
  catastrophic: .05 # very high noise breaking everything

noise_level: [0.0, .2] # there might be additional noise later

add_gp_bias: true
add_gp_max_std: [0.2, 1.] #[0.2, 1.]
add_gp_lengthscale: [.5, 3.0]
add_gp_scale: [0.2, 2.0]

local_distortion: true
distortion_range: [0.2, 1.] # for local distortion bias, sign will be randomized
distortion_centers: [1, 3] # for local distortion bias
distortion_decay: [0.5, 1.5]

catastrophic: true # noise std = 2

constant_shift_bias: true
constant_shift_bias_range: [-0.5, 0.5]

knowledge_center: True # true
knowledge_center_noise_radiation_scale: [0.0, 1.] # for knowledge center bias, this is the max noise scale at the radiation level (max distance in batch)


# below are other biases we came up iwht.. many of them have not been tested
# they did not seem necessary, but you may like to try some... 
#-----------------------------------------------------------------------------
local_averaging: false
local_averaging_alpha: [0.2, 0.5]
local_averaging_lengthscale: [0.1, .5]

perceived_max_bias: False
perceived_max_alpha: [0.3, 1.5]

#-------------------------------------------------------------------------------
binning: False
binning_k: 7
#if these tho are specified, we do static binning, otherwise dynamic binning based on the batch min/max
#binning_y_min: -1.5
#binning_y_max: 1.5

rank_normalize: false

rounding: False
rounding_scale: 4 # 4 -> round to quarters

#-------------------------------------------------------------------------------
hetero_noise: false # probably just too specific
hetero_alpha: [0.5, 1] # max std
hetero_n_centers: [2, 6]
hetero_decay: [0.5, 1.5]

regression_to_mean: false
regression_alpha: [0.1, 0.4]

anchoring: false
anchor_alpha: [0.1, 0.4]

expectation_bias: false
expectation_alpha: [0.05, 0.15]

hard_easy: false
hard_easy_alpha: [0.1, 0.3]

simplification: false
simplification_alpha: [0.1, 0.3]

# not the most principaled, add gp seems enough
feature_weight: false
feature_coef: [0.2, 0.5]

cross_dim_confusion: false # probably not worth the comp cost
confusion_prob: [0.03, 0.1]

# ---------------for expert uncertainty-----------------------------------------
uncertainty_noise_std_range: [.05, .5] #unused
#device: cuda
